# ===== Server =====
server.port=8084
spring.application.name=analytics-gateway-service

# ===== Service Discovery =====
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

# ===== Downstream FastAPI analytics service =====
analytics.python.base-url=http://localhost:8000

# ===== Feign =====
spring.cloud.openfeign.client.config.default.connectTimeout=5000
spring.cloud.openfeign.client.config.default.readTimeout=15000
logging.level.com.healthcare.analyticsgateway.client=DEBUG

# ===== Logging =====
logging.level.com.healthcare.analyticsgateway=DEBUG
