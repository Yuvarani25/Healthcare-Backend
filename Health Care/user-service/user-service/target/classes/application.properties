# ===== Server =====
server.port=8081
spring.application.name=user-service

# ===== Service Discovery =====
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

# ===== MySQL =====
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:healthcare_users}?createDatabaseIfNotExist=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===== JPA / Hibernate =====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ===== JWT =====
jwt.secret=${JWT_SECRET:ChangeThisToALongRandomSecretKeyForHS256SigningAtLeast32Bytes!}
jwt.expiration.ms=${JWT_EXPIRATION_MS:86400000}

# ===== CORS =====
# Comma-separated list of allowed front-end origins
app.cors.allowed-origins=http://localhost:3000,http://localhost:5173

# ===== Logging =====
logging.level.org.springframework.security=INFO
logging.level.com.healthcare.userservice=DEBUG
