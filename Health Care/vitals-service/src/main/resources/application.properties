# ===== Server =====
server.port=8082
spring.application.name=vitals-service

# ===== Service Discovery =====
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

# ===== MySQL =====
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:healthcare_vitals}?createDatabaseIfNotExist=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===== JPA / Hibernate =====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ===== Security =====
# Must match the signing secret used by user-service
jwt.secret=${JWT_SECRET:ChangeThisToALongRandomSecretKeyForHS256SigningAtLeast32Bytes!}

# ===== Logging =====
logging.level.com.healthcare.vitalsservice=DEBUG
